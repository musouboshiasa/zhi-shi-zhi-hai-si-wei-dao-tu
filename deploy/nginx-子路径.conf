# 知识之海 - 子路径部署配置（与现有网站/网盘共存）
# ======================================================
# 适用场景：musouboshiasa.com 已有网站（如首页、网盘等），
# 知识之海部署在 https://musouboshiasa.com/ruanjian/ 子路径下
#
# 使用方法（任选其一）：
#   方法A：宝塔面板 → 网站 → 对应站点 → 配置文件（或 反向代理）→ 追加下面内容
#   方法B：手动 Nginx：把下面 server 块内容合并进现有 /etc/nginx/sites-available/ 配置
#   方法C：执行 deploy/deploy.sh 后自动追加（脚本会检测）
# ======================================================

# ========== 追加到现有 server 块内（方法A/B） ==========

# 无尾斜杠访问 /ruanjian 时自动补斜杠
location = /ruanjian {
    return 301 /ruanjian/;
}

# 知识之海反向代理（核心配置）
location /ruanjian/ {
    # 带尾斜杠的 proxy_pass 会剥掉 /ruanjian/ 前缀转发给 Node 应用
    proxy_pass http://127.0.0.1:3000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    # 上传大小限制（图片上传用，与现有配置冲突时按需调整）
    client_max_body_size 50M;
}


# ========== 独立站点部署（仅在 /ruanjian 目录没有被其他方式占用时使用） ==========
