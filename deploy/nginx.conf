# 知识之海 - Nginx 配置
# 使用方法：将本文件复制到 /etc/nginx/sites-available/knowledge-sea
# 然后执行: ln -s /etc/nginx/sites-available/knowledge-sea /etc/nginx/sites-enabled/
#          nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name musouboshiasa.com www.musouboshiasa.com;

    # 将 HTTP 自动跳转到 HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name musouboshiasa.com www.musouboshiasa.com;

    # SSL 证书（用 certbot 自动申请后会自动填入，无需手动配置）
    ssl_certificate     /etc/letsencrypt/live/musouboshiasa.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/musouboshiasa.com/privkey.pem;

    # 上传大小限制（图片上传用）
    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
