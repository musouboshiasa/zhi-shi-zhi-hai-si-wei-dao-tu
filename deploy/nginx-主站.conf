# ======================================================
# 无双星晨的小站 · Nginx 主站配置（musouboshiasa.com）
# ======================================================
# 架构：
#   /            → 静态首页（无双星晨的小站，即仓库里的 主站/index.html）
#   /ruanjian/   → 知识点软件（知识之海 Node.js 应用，端口 3000）
#   /drive/      → 个人网盘（FileBrowser，端口 8080）
#
# 使用步骤：
#   1. 把本文件内容合并进你的站点配置
#      - 手动 Nginx：放到 /etc/nginx/sites-available/ 并软链到 sites-enabled/
#      - 宝塔面板：网站 → 对应站点 → 配置文件
#   2. 把仓库里的 主站/index.html 上传到下方 root 指定的目录
#   3. 按实际情况修改：root 目录、SSL 证书路径、网盘端口(8080)
#   4. 执行：nginx -t && systemctl reload nginx
# ======================================================

# ---------- HTTP：自动跳转 HTTPS ----------
server {
    listen 80;
    server_name musouboshiasa.com www.musouboshiasa.com;

    # 强制跳转到 HTTPS
    return 301 https://$host$request_uri;
}

# ---------- HTTPS 主服务 ----------
server {
    listen 443 ssl http2;
    server_name musouboshiasa.com www.musouboshiasa.com;

    # SSL 证书（用 certbot 申请后会自动生成到下面路径）
    # 申请命令：certbot --nginx -d musouboshiasa.com -d www.musouboshiasa.com
    ssl_certificate     /etc/letsencrypt/live/musouboshiasa.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/musouboshiasa.com/privkey.pem;

    # 上传大小限制（知识点图片上传用）
    client_max_body_size 50M;

    # ===== 主站首页（静态文件）=====
    # 把仓库里的 主站/index.html 上传到这个目录（宝塔通常是 /www/wwwroot/musouboshiasa.com）
    root /var/www/musouboshiasa.com;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # ===== 知识点软件（知识之海）=====
    # 无尾斜杠访问自动补斜杠
    location = /ruanjian {
        return 301 /ruanjian/;
    }
    location /ruanjian/ {
        # 带尾斜杠的 proxy_pass 会把 /ruanjian/ 前缀剥掉后转发给 Node 应用
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        client_max_body_size 50M;
    }

    # ===== 个人网盘（FileBrowser）=====
    # 注意：若 FileBrowser 内部链接指向根路径（如 /login、/files），
    # 需要在 FileBrowser 里把 baseURL 设为 /drive/，否则子路径下链接会错乱。
    # 若你的 FileBrowser 没配 baseURL，可改为 proxy_pass http://127.0.0.1:8080;（不带尾斜杠）试试。
    location = /drive {
        return 301 /drive/;
    }
    location /drive/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        client_max_body_size 500M;   # 网盘上传大文件用
    }
}
